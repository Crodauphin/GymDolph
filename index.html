<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#071D5F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitTrack" />
  <title>FitTrack — FitPlace24 Sapporo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════
     SPLASH / LOADING SCREEN
═══════════════════════════════════════════ -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo-wrap">
      <img src="icons/logo-main.png" alt="FitTrack Logo" class="splash-logo" onerror="this.style.display='none';document.getElementById('splash-text-logo').style.display='block'" />
      <div id="splash-text-logo" class="splash-text-logo" style="display:none">FIT<span>TRACK</span></div>
    </div>
    <div class="splash-tagline">FitPlace24 · Sapporo</div>
    <div class="splash-loader"><div></div></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     MAIN APP SHELL
═══════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- TOP HEADER -->
  <header id="app-header">
    <div class="header-left">
      <img src="icons/logo-small.png" alt="" class="header-logo" onerror="this.style.display='none'" />
      <span class="header-title" id="header-title">FITTRACK</span>
    </div>
    <div class="header-right">
      <button class="hdr-btn" id="btn-history" onclick="showView('history')" title="History">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L15 9h4V5l-1.49 1.49A8.97 8.97 0 0 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      </button>
      <button class="hdr-btn" id="btn-settings" onclick="showView('settings')" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a6.99 6.99 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- ══ VIEW: HOME (Day Selector) ══ -->
  <div id="view-home" class="view active">
    <div class="view-scroll">
      <div class="home-banner">
        <div class="banner-date" id="banner-date"></div>
        <div class="banner-streak"><span id="streak-count">0</span> day streak 🔥</div>
      </div>

      <div class="section-label">TRAINING PROGRAM</div>
      <div class="day-cards" id="day-cards"></div>

      <div class="section-label" style="margin-top:24px">QUICK START</div>
      <div class="quick-start-row">
        <button class="qs-btn" onclick="startWorkout(getActiveDay())">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Start Today
        </button>
        <button class="qs-btn secondary" onclick="showView('history')">
          <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z"/></svg>
          History
        </button>
      </div>
    </div>
  </div>

  <!-- ══ VIEW: WORKOUT ══ -->
  <div id="view-workout" class="view">
    <div class="view-scroll" id="workout-scroll">
      <div class="workout-header-block">
        <button class="back-btn" onclick="showView('home')">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div>
          <div class="workout-day-label" id="wd-day-label">D1</div>
          <div class="workout-focus" id="wd-focus">Chest + Triceps</div>
        </div>
        <div class="workout-timer-block">
          <div class="timer-display" id="timer-display">00:00</div>
          <div class="timer-btns">
            <button class="timer-btn" id="timer-toggle" onclick="toggleTimer()">▶</button>
            <button class="timer-btn danger" onclick="resetTimer()">↺</button>
          </div>
        </div>
      </div>

      <div class="workout-progress-bar-wrap">
        <div class="workout-progress-bar" id="workout-progress-bar"></div>
        <span class="progress-label" id="progress-label">0 / 0 done</span>
      </div>

      <div id="workout-blocks"></div>

      <div class="finish-btn-wrap">
        <button class="finish-btn" onclick="finishWorkout()">
          ✓ FINISH WORKOUT
        </button>
      </div>
    </div>
  </div>

  <!-- ══ VIEW: HISTORY ══ -->
  <div id="view-history" class="view">
    <div class="view-scroll">
      <div class="view-page-title">WORKOUT HISTORY</div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <!-- ══ VIEW: SETTINGS ══ -->
  <div id="view-settings" class="view">
    <div class="view-scroll">
      <div class="view-page-title">SETTINGS</div>
      <div class="settings-group">
        <div class="settings-label">GYM</div>
        <div class="settings-item">
          <span>FitPlace24 Sapporo</span>
          <span class="settings-sub">9 Chome-3-5 Minami 9 Jonishi, Chuo Ward</span>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label">DATA</div>
        <button class="settings-btn danger" onclick="clearHistory()">Clear All History</button>
        <button class="settings-btn" onclick="exportData()">Export Data (JSON)</button>
      </div>
      <div class="settings-group">
        <div class="settings-label">APP</div>
        <div class="settings-item">
          <span>Version</span><span class="settings-val">0.1</span>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="showView('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" id="nav-workout" onclick="startWorkout(getActiveDay())">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
      <span>Train</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="showView('history')">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L15 9h4V5l-1.49 1.49A8.97 8.97 0 0 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </button>
  </nav>

</div><!-- /#app -->

<!-- ═══════════════════════════════════════════
     REST TIMER OVERLAY
═══════════════════════════════════════════ -->
<div id="rest-overlay" style="display:none">
  <div class="rest-box">
    <div class="rest-title">REST</div>
    <div class="rest-countdown" id="rest-countdown">60</div>
    <div class="rest-progress-ring">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" class="ring-bg"/>
        <circle cx="50" cy="50" r="44" class="ring-fg" id="ring-fg"/>
      </svg>
    </div>
    <button class="rest-skip" onclick="skipRest()">SKIP REST</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     SET LOG MODAL
═══════════════════════════════════════════ -->
<div id="set-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-title" id="modal-ex-name"></div>
    <div class="modal-fields">
      <div class="modal-field">
        <label>Weight (kg)</label>
        <input type="number" id="modal-weight" placeholder="0" min="0" step="0.5" />
      </div>
      <div class="modal-field">
        <label>Reps</label>
        <input type="number" id="modal-reps" placeholder="0" min="0" />
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmSet()">LOG SET</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
